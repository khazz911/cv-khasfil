<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="bullCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bearCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="360" rx="16" fill="url(#bg)"/>
  <rect width="600" height="360" rx="16" fill="url(#grid)" opacity="0.6"/>

  <!-- Top bar of mock interface -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e293b" opacity="0.8"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <text x="96" y="26" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8">XAUUSD [M1] Momentum Engine v1.2 — Tailscale: 100.84.12.9</text>
  
  <!-- Status Badge -->
  <rect x="480" y="12" width="105" height="20" rx="10" fill="#064e3b"/>
  <circle cx="493" cy="22" r="4" fill="#34d399"/>
  <text x="504" y="26" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399">RUNNING</text>

  <!-- Moving average trendline (cyan) -->
  <path d="M 40 250 Q 120 230, 180 200 T 300 160 T 420 120 T 560 70" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.85"/>
  <path d="M 40 270 Q 130 250, 200 230 T 320 200 T 430 160 T 560 110" fill="none" stroke="#eab308" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Candlesticks (Candle Momentum Scalper) -->
  <!-- Candle 1: Red -->
  <line x1="80" y1="210" x2="80" y2="280" stroke="#f87171" stroke-width="1.5"/>
  <rect x="73" y="230" width="14" height="35" rx="2" fill="url(#bearCandle)"/>

  <!-- Candle 2: Red small -->
  <line x1="120" y1="235" x2="120" y2="295" stroke="#f87171" stroke-width="1.5"/>
  <rect x="113" y="245" width="14" height="25" rx="2" fill="url(#bearCandle)"/>

  <!-- Candle 3: Green Hammer (Reversal) -->
  <line x1="160" y1="205" x2="160" y2="290" stroke="#34d399" stroke-width="1.5"/>
  <rect x="153" y="215" width="14" height="20" rx="2" fill="url(#bullCandle)"/>

  <!-- Candle 4: Bullish Momentum (Big Green) -->
  <line x1="210" y1="150" x2="210" y2="250" stroke="#34d399" stroke-width="2"/>
  <rect x="201" y="165" width="18" height="65" rx="3" fill="url(#bullCandle)"/>

  <!-- Candle 5: Pullback -->
  <line x1="260" y1="160" x2="260" y2="220" stroke="#f87171" stroke-width="1.5"/>
  <rect x="253" y="175" width="14" height="20" rx="2" fill="url(#bearCandle)"/>

  <!-- Candle 6: Strong Momentum Breakout Candle -->
  <line x1="310" y1="95" x2="310" y2="200" stroke="#34d399" stroke-width="2.5"/>
  <rect x="300" y="110" width="20" height="80" rx="3" fill="url(#bullCandle)" stroke="#6ee7b7" stroke-width="1"/>

  <!-- Candle 7: Continuation Bullish -->
  <line x1="365" y1="85" x2="365" y2="170" stroke="#34d399" stroke-width="2"/>
  <rect x="356" y="95" width="18" height="55" rx="3" fill="url(#bullCandle)"/>

  <!-- Candle 8: Consolidation -->
  <line x1="420" y1="90" x2="420" y2="155" stroke="#f87171" stroke-width="1.5"/>
  <rect x="413" y="105" width="14" height="28" rx="2" fill="url(#bearCandle)"/>

  <!-- Candle 9: Massive Explosive Momentum Candle -->
  <line x1="475" y1="45" x2="475" y2="135" stroke="#34d399" stroke-width="2.5"/>
  <rect x="464" y="55" width="22" height="70" rx="3" fill="url(#bullCandle)" stroke="#34d399" stroke-width="1.5"/>

  <!-- Buy Order Marker -->
  <circle cx="310" cy="190" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="305" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">↑</text>
  <rect x="325" y="178" width="85" height="22" rx="4" fill="#0369a1" opacity="0.95"/>
  <text x="331" y="193" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#e0f2fe">BUY @ 2742.50</text>

  <!-- Floating Stats Card (Glassmorphism effect) -->
  <rect x="30" y="275" width="540" height="65" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  
  <text x="45" y="297" font-family="sans-serif" font-size="11" fill="#94a3b8">PAIR</text>
  <text x="45" y="322" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">XAUUSD (GOLD)</text>

  <line x1="175" y1="285" x2="175" y2="330" stroke="#334155" stroke-width="1"/>

  <text x="195" y="297" font-family="sans-serif" font-size="11" fill="#94a3b8">STRATEGY</text>
  <text x="195" y="322" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Momentum Scalp</text>

  <line x1="325" y1="285" x2="325" y2="330" stroke="#334155" stroke-width="1"/>

  <text x="345" y="297" font-family="sans-serif" font-size="11" fill="#94a3b8">FLOATING PNL</text>
  <text x="345" y="324" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#34d399">+$148.20 USD</text>

  <line x1="465" y1="285" x2="465" y2="330" stroke="#334155" stroke-width="1"/>

  <text x="480" y="297" font-family="sans-serif" font-size="11" fill="#94a3b8">REMOTE (TAILSCALE)</text>
  <text x="480" y="322" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">● HP Connected</text>
</svg>
