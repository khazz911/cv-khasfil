<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#avatarGrad)" stroke="url(#accentGrad)" stroke-width="4"/>
  
  <!-- Subtle Grid Pattern in background -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="100" cy="75" r="32" fill="#94a3b8"/>
  <!-- Hair / Accents -->
  <path d="M 68 75 C 68 50, 80 40, 100 40 C 120 40, 132 50, 132 75 C 132 60, 120 48, 100 48 C 80 48, 68 60, 68 75 Z" fill="#0ea5e9"/>
  <!-- Shoulders / Body -->
  <path d="M 45 160 C 45 125, 70 115, 100 115 C 130 115, 155 125, 155 160 Z" fill="#64748b"/>
  <!-- Shirt collar -->
  <polygon points="100,128 85,115 115,115" fill="#f8fafc"/>
  
  <!-- Decorative Tech ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 18" opacity="0.6"/>
  <!-- Status Badge icon at bottom right -->
  <circle cx="150" cy="150" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <circle cx="150" cy="150" r="7" fill="#10b981"/>
</svg>
